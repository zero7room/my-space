name: CI

on:
  push:
    branches: [main, bot1]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm lint
      - run: pnpm -r build
      - run: pnpm -r test
      - run: pnpm test:evals
